name: Backend CI

on:
  pull_request:
    branches: [main]
#  push:
#    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Project.slnx

      - name: Check formatting
        run: dotnet format Project.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Project.slnx --no-restore --configuration Release

      - name: Run tests
        run: >
          dotnet test Project.slnx
          --no-restore
          --configuration Release
          --no-build
